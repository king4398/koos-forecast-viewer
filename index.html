<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KOOS MOHID Forecast Viewer</title>

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="map"></div>
  <canvas id="raster-canvas"></canvas>

  <div id="top-panel">
    <div class="title">KOOS Forecast Viewer</div>
    <div class="subtitle">MOHID Surface Forecast</div>
  </div>

  <div id="layer-panel">
    <label class="control-label" for="var-select">Variable</label>
    <select id="var-select">
      <option value="temperature">Temperature</option>
      <option value="salinity">Salinity</option>
      <option value="ssh">Elevation</option>
      <option value="current_speed">Current Speed</option>
    </select>

    <label class="control-label" for="opacity-slider">Opacity</label>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.82" />

    <label class="control-label">Base Map</label>
    <div class="radio-row">
      <label><input type="radio" name="basemap" value="light" checked /> Light</label>
      <label><input type="radio" name="basemap" value="satellite" /> Satellite</label>
    </div>

    <div id="status-line">Loading...</div>
  </div>

  <div id="legend-box"></div>

  <div id="time-panel">
    <button id="play-btn">Play</button>
    <input id="frame-slider" type="range" min="0" max="0" step="1" value="0" />
    <div id="time-label">--</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
