<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KOOS MOHID Forecast Viewer</title>
  <link rel="icon" href="data:,">

  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
  <div id="map"></div>
  <canvas id="raster-canvas"></canvas>

  <div id="top-panel">
    <div class="title">KOOS Forecast Viewer</div>
    <div class="subtitle">MOHID Surface Forecast</div>
  </div>

  <div id="layer-panel">
    <label class="control-label" for="var-select">Variable</label>
    <select id="var-select">
      <option value="temperature">Temperature</option>
      <option value="salinity">Salinity</option>
      <option value="ssh">Elevation</option>
      <option value="current_speed">Current Speed</option>
    </select>

    <label class="control-label" for="opacity-slider">Opacity</label>
    <input id="opacity-slider" type="range" min="0" max="1" step="0.05" value="0.82" />

    <label class="check-row">
      <span>Mesh overlay</span>
      <input id="mesh-overlay-check" type="checkbox" />
    </label>

    <label class="check-row">
      <span>Current particles</span>
      <input id="current-overlay-check" type="checkbox" checked />
    </label>

    <label class="control-label" for="particle-density-select">Particles</label>
    <select id="particle-density-select">
      <option value="500">Low</option>
      <option value="900" selected>Mid</option>
      <option value="1500">High</option>
    </select>

    <label class="control-label">Base Map</label>
    <div class="radio-row">
      <label><input type="radio" name="basemap" value="light" /> Light</label>
      <label><input type="radio" name="basemap" value="satellite" checked /> Satellite</label>
    </div>

    <div id="status-line">Loading...</div>
  </div>

  <div id="legend-box"></div>

  <div id="time-panel">
    <button id="play-btn">Play</button>
    <input id="frame-slider" type="range" min="0" max="0" step="1" value="0" />
    <div id="time-label">--</div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="src/maplibre_mohid.js?v=particles_natural_01"></script>

  <div id="ust21-logo-overlay">
    <div id="ust21-logo-title">UST21 수치예보팀</div>
    <div id="made-by-nyj">made by nyj</div>
    <img id="ust21-logo-img" src="assets/ust21.png?v=logo_update_02" alt="UST21 logo" width="120">
  </div>

  <script>
  (function(){
    function setupUst21Click(){
      const title = document.getElementById("ust21-logo-title");
      const made = document.getElementById("made-by-nyj");
      if(!title || !made || title.dataset.clickReady === "1") return;
      title.dataset.clickReady = "1";
      title.addEventListener("click", function(ev){
        ev.preventDefault();
        ev.stopPropagation();
        made.style.display = (made.style.display === "none" || made.style.display === "") ? "block" : "none";
      });
    }
    if(document.readyState === "loading"){
      document.addEventListener("DOMContentLoaded", setupUst21Click);
    } else {
      setupUst21Click();
    }
  })();
  </script>

</body>
</html>
